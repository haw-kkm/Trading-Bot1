name: stage0 public live verification

on:
  push:
    branches:
      - verify-stage0-public-live-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-exchanges:
    name: Public read-only Binance + Toobit REST/WS (evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned project requirements
        run: python -m pip install -r requirements.txt
      - name: Verify live public market data and record evidence
        run: |
          python tools/stage0_live_verify.py \
            --seconds 30 \
            --timeout-seconds 150 \
            --approve-toobit-public-readonly \
            --output-dir stage0-live-evidence
      - name: Archive reproducible evidence even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-live-evidence-${{ github.sha }}
          path: stage0-live-evidence/
          retention-days: 14
          if-no-files-found: warn
