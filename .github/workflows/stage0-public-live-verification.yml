name: stage0 public live verification

on:
  push:
    branches:
      - verify-stage0-public-live-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-exchanges:
    name: Public Binance Spot/Futures + Toobit REST/WS (evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned project requirements
        run: python -m pip install -r requirements.txt
      - name: Verify live public market data and record evidence
        run: |
          set +e
          python tools/stage0_live_verify.py             --seconds 30             --timeout-seconds 150             --approve-toobit-public-readonly             --output-dir stage0-live-evidence
          code=$?
          set -e
          # 0 = all PASS, 1 = at least one FAIL (job fails), 2 = no FAIL but NOT_RUN/INCONCLUSIVE stages
          # (e.g. Binance HTTP 451 from the GitHub runner region: reported, never bypassed, never PASS).
          if [ "$code" -eq 2 ]; then
            echo "::warning::Not every stage PASSED (NOT_RUN/INCONCLUSIVE). See verification-report.json."
            exit 0
          fi
          exit $code
      - name: Archive reproducible evidence even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-live-evidence-${{ github.sha }}
          path: stage0-live-evidence/
          retention-days: 14
          if-no-files-found: warn
